[project]
name = "x-ui-migration"
version = "0.1.0"
description = "Database migration tool for migrating data from x-ui to Pasarguard (SQLite to SQLite)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migration"]

